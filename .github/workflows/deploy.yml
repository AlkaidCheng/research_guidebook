name: Build and deploy site

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Monthly, so that a new release of bookspine reaches the site and a breaking one
    # shows early. A failed build leaves the site as it was.
    - cron: "29 6 2 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  # Supersede stale pull-request builds, but let a running deployment finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # The last commit's date, so that a scheduled build does not advance "revised".
      - run: SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) bookspine build
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
