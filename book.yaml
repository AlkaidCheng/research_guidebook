title: Research Guidebook
subtitle: Methods, tools and conventions from my research projects
kicker: Notes and methods
author: Alkaid Cheng
url: https://alkaidcheng.github.io/research_guidebook/
repo: https://github.com/AlkaidCheng/research_guidebook
repo_host: GitHub
# A page's edit link is this prefix followed by its path under book/.
edit_url: https://github.com/AlkaidCheng/research_guidebook/blob/main/book/
mathjax_macros:
  dd: \mathrm{d}
  pT: p_{\mathrm{T}}
  vec: ['\boldsymbol{#1}', 1]

# Parts are categories; chapters are the topics inside them. Chapters are
# numbered continuously through the book, parts with Roman numerals.
# Each part directory needs an index.md. A chapter is one Markdown file with a
# YAML front matter block (title, summary, optional status, references), or a
# directory (dir) with an index.md opener and one such file per section page.
parts:
  - dir: hep
    title: High Energy Physics
    chapters:
      - event-generation.md
      - detector-simulation.md
      - statistical-inference.md
