<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="var(--ink-2, #4a463f)"/>
    </marker>
  </defs>
  <style>
    .box { fill: none; stroke: var(--ink-2, #4a463f); stroke-width: 1.4; }
    .stage { fill: var(--ink-3, #7a756b); font-size: 11px; letter-spacing: 1.6px; text-anchor: middle; }
    .name { fill: var(--ink, #1d1b17); font-size: 14px; font-weight: 600; text-anchor: middle; }
    .tool { fill: var(--ink-2, #4a463f); font-size: 12px; text-anchor: middle; font-style: italic; }
    .fmt { fill: var(--accent-ink, #6a2522); font-size: 11.5px; font-weight: 700; text-anchor: middle; letter-spacing: 0.6px; }
    .flow { stroke: var(--ink-2, #4a463f); stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
    .dash { stroke-dasharray: 4 4; }
    .brace { stroke: var(--ink-3, #7a756b); stroke-width: 1; fill: none; }
    .group { fill: var(--ink-2, #4a463f); font-size: 11px; letter-spacing: 1.6px; text-anchor: middle; }
  </style>

  <!-- stage boxes -->
  <g>
    <rect class="box" x="10" y="70" width="130" height="70" rx="4"/>
    <text class="stage" x="75" y="92">STAGE 1</text>
    <text class="name" x="75" y="112">Hard process</text>
    <text class="tool" x="75" y="130">matrix elements</text>
  </g>
  <g>
    <rect class="box" x="210" y="70" width="130" height="70" rx="4"/>
    <text class="stage" x="275" y="92">STAGE 2</text>
    <text class="name" x="275" y="112">Parton shower</text>
    <text class="tool" x="275" y="130">+ multiple interactions</text>
  </g>
  <g>
    <rect class="box" x="410" y="70" width="130" height="70" rx="4"/>
    <text class="stage" x="475" y="92">STAGE 3</text>
    <text class="name" x="475" y="112">Hadronisation</text>
    <text class="tool" x="475" y="130">+ decays</text>
  </g>
  <g>
    <rect class="box dash" x="610" y="70" width="180" height="70" rx="4"/>
    <text class="stage" x="700" y="92">DOWNSTREAM</text>
    <text class="name" x="700" y="112">Detector simulation</text>
    <text class="tool" x="700" y="130">+ reconstruction</text>
  </g>

  <!-- flow arrows with the format carried across each boundary -->
  <path class="flow" d="M140 105 H208"/>
  <text class="fmt" x="174" y="96">LHE</text>
  <path class="flow" d="M340 105 H408"/>
  <path class="flow" d="M540 105 H608"/>
  <text class="fmt" x="574" y="96">HepMC3</text>

  <!-- programs -->
  <text class="tool" x="75" y="172">MadGraph5_aMC@NLO</text>
  <path class="brace" d="M215 158 V166 H535 V158"/>
  <text class="tool" x="375" y="184">Pythia 8</text>
  <text class="tool" x="700" y="172">Delphes</text>

  <!-- scale annotation -->
  <text class="group" x="275" y="40">PERTURBATIVE QCD · SCALES FROM Q DOWN TO ~1 GeV</text>
  <path class="brace" d="M12 50 V46 H538 V50"/>
  <text class="group" x="700" y="40">CHAPTER 2</text>
  <path class="brace" d="M612 50 V46 H788 V50"/>

  <!-- output note -->
  <text class="group" x="400" y="224">STABLE PARTICLES: THE GENERATOR-LEVEL TRUTH RECORD HANDED TO THE DETECTOR SIMULATION</text>
</svg>
