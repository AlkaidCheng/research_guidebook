<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 250" width="780" height="250" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8a857b"/>
    </marker>
  </defs>
  <style>
    .box { fill: none; stroke: #8a857b; stroke-width: 1.4; }
    .stage { fill: #9a948a; font-size: 11px; letter-spacing: 1.6px; text-transform: uppercase; text-anchor: middle; }
    .name { fill: #8a857b; font-size: 14px; font-weight: 600; text-anchor: middle; }
    .tool { fill: #8a857b; font-size: 12px; text-anchor: middle; font-style: italic; }
    .fmt { fill: #a6554f; font-size: 11.5px; font-weight: 600; text-anchor: middle; letter-spacing: 0.6px; }
    .flow { stroke: #8a857b; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
    .dash { stroke-dasharray: 4 4; }
    .brace { stroke: #8a857b; stroke-width: 1; fill: none; }
    .group { fill: #9a948a; font-size: 11px; letter-spacing: 1.6px; text-anchor: middle; }
  </style>

  <!-- stage boxes -->
  <g>
    <rect class="box" x="10" y="70" width="140" height="70" rx="4"/>
    <text class="stage" x="80" y="92">Stage 1</text>
    <text class="name" x="80" y="112">Hard process</text>
    <text class="tool" x="80" y="130">matrix elements</text>
  </g>
  <g>
    <rect class="box" x="200" y="70" width="140" height="70" rx="4"/>
    <text class="stage" x="270" y="92">Stage 2</text>
    <text class="name" x="270" y="112">Parton shower</text>
    <text class="tool" x="270" y="130">+ multiple interactions</text>
  </g>
  <g>
    <rect class="box" x="390" y="70" width="140" height="70" rx="4"/>
    <text class="stage" x="460" y="92">Stage 3</text>
    <text class="name" x="460" y="112">Hadronisation</text>
    <text class="tool" x="460" y="130">+ decays</text>
  </g>
  <g>
    <rect class="box dash" x="580" y="70" width="190" height="70" rx="4"/>
    <text class="stage" x="675" y="92">Downstream</text>
    <text class="name" x="675" y="112">Detector simulation</text>
    <text class="tool" x="675" y="130">+ reconstruction</text>
  </g>

  <!-- flow arrows with the format carried across each boundary -->
  <path class="flow" d="M150 105 H198"/>
  <text class="fmt" x="175" y="96">LHE</text>
  <path class="flow" d="M340 105 H388"/>
  <path class="flow" d="M530 105 H578"/>
  <text class="fmt" x="555" y="96">HepMC3</text>

  <!-- programs -->
  <text class="tool" x="80" y="170">MadGraph5_aMC@NLO</text>
  <path class="brace" d="M205 158 V166 H525 V158"/>
  <text class="tool" x="365" y="182">Pythia 8</text>
  <text class="tool" x="675" y="170">Delphes</text>

  <!-- scale annotation -->
  <text class="group" x="270" y="40">Perturbative QCD · scales from Q down to ~1 GeV</text>
  <path class="brace" d="M12 50 V46 H528 V50"/>
  <text class="group" x="675" y="40">Chapter 2</text>
  <path class="brace" d="M582 50 V46 H768 V50"/>

  <!-- output note -->
  <text class="group" x="390" y="222">Stable particles: the generator-level truth record handed to the detector simulation</text>
</svg>
