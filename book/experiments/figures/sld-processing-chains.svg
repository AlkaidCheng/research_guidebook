  <text class="st mid" x="196" y="249">PASS1</text>
  <text class="sub mid" x="196" y="263">drops about 97% of</text>
  <text class="sub mid" x="196" y="276">triggers (1993)</text>
  <rect class="paper" x="270" y="226" width="112" height="64" rx="4"/>
  <rect class="tf" x="270" y="226" width="112" height="64" rx="4" fill="var(--box-definition, #2f5d7c)" fill-opacity="0.1" stroke="var(--box-definition, #2f5d7c)"/>
  <text class="st mid" x="326" y="249">PASS2</text>
  <text class="sub mid" x="326" y="263">first reconstruction,</text>
  <text class="sub mid" x="326" y="276">event-class tags</text>
  <line class="ln" x1="124" y1="258" x2="137" y2="258" marker-end="url(#pc-arrow-ink-2)"/>
  <line class="ln" x1="254" y1="258" x2="267" y2="258" marker-end="url(#pc-arrow-ink-2)"/>
  <rect class="paper" x="524" y="130" width="112" height="64" rx="4"/>
  <rect class="tf" x="524" y="130" width="112" height="64" rx="4" fill="var(--ink-2, #4a463f)" fill-opacity="0.1" stroke="var(--ink-2, #4a463f)"/>
  <text class="st mid" x="580" y="153">Reconstruction</text>
  <text class="sub mid" x="580" y="167">RECSLD, frozen</text>
  <text class="sub mid" x="580" y="180">production code</text>
  <rect class="paper" x="650" y="130" width="90" height="64" rx="4"/>
  <rect class="tf" x="650" y="130" width="90" height="64" rx="4" fill="var(--ink-2, #4a463f)" fill-opacity="0.1" stroke="var(--ink-2, #4a463f)"/>
  <text class="st mid" x="695" y="159.5">DST</text>
  <text class="sub mid" x="695" y="173.5">full output</text>
  <line class="ln" x1="514" y1="66" x2="580" y2="128" marker-end="url(#pc-arrow-ink-2)"/>
  <polyline class="ln" points="196,224 196,162 521,162" marker-end="url(#pc-arrow-ink-2)"/>
  <text class="note mid" x="326" y="306">not used for physics</text>
  <line class="ln" x1="638" y1="162" x2="647" y2="162" marker-end="url(#pc-arrow-ink-2)"/>
  <rect class="paper" x="650" y="230" width="90" height="64" rx="4"/>
  <rect class="tf" x="650" y="230" width="90" height="64" rx="4" fill="var(--accent, #7f2e2a)" fill-opacity="0.14" stroke="var(--accent, #7f2e2a)"/>
  <text class="st mid" x="695" y="253">Mini-DST</text>
  <text class="sub mid" x="695" y="267">compressed</text>
  <text class="sub mid" x="695" y="280">format</text>
  <line class="ln" x1="695" y1="196" x2="695" y2="227" marker-end="url(#pc-arrow-ink-2)"/>
  <text class="note mid" x="580" y="210">same code for data and MC</text>
  <text class="note mid" x="695" y="310">the format of this chapter</text>
</svg>
