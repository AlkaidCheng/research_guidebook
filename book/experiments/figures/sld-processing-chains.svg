<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330">
  <defs>
    <marker id="pc-arrow-ink-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--ink-2, #4a463f)"/></marker>
  </defs>
  <style>
    .t { fill: var(--ink, #1d1b17); font-size: 12px; }
    .t2 { fill: var(--ink-2, #4a463f); font-size: 11px; }
    .t3 { fill: var(--ink-3, #7a756b); font-size: 10px; }
    .tb { font-weight: 600; }
    .ti { font-style: italic; }
    .ta { fill: var(--accent-ink, #6a2522); }
    .caps { letter-spacing: 1.4px; }
    .mono { font-family: var(--mono, monospace); }
    .start { text-anchor: start; }
    .mid { text-anchor: middle; }
    .end { text-anchor: end; }
    .ln { stroke: var(--ink-2, #4a463f); stroke-width: 1.2; fill: none; }
    .ln3 { stroke: var(--ink-3, #7a756b); stroke-width: 1; fill: none; }
    .thin { stroke-width: 0.7; }
    .dash { stroke-dasharray: 4 3; }
    .box { stroke: var(--ink-2, #4a463f); stroke-width: 1.2; fill: none; }
    .paper { fill: var(--paper, #fbfaf7); }

    .st { fill: var(--ink, #1d1b17); font-size: 12px; font-weight: 600; }
    .sub { fill: var(--ink-2, #4a463f); font-size: 10.5px; }
    .note { fill: var(--ink-3, #7a756b); font-size: 10px; }
    .lane { fill: var(--ink-3, #7a756b); font-size: 10.5px; letter-spacing: 1.4px; }
    .tf { stroke-width: 1.1; }
  </style>
  <text class="lane start" x="10" y="22">SIMULATED EVENTS</text>
