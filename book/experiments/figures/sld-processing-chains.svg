  <text class="st mid" x="66" y="57">Beam</text>
  <text class="sub mid" x="66" y="71">MCSLC:</text>
  <text class="sub mid" x="66" y="84">energies, IP, helicity</text>
  <rect class="paper" x="140" y="34" width="112" height="64" rx="4"/>
  <rect class="tf" x="140" y="34" width="112" height="64" rx="4" fill="var(--box-warning, #a3471e)" fill-opacity="0.1" stroke="var(--box-warning, #a3471e)"/>
  <text class="st mid" x="196" y="57">Generator</text>
  <text class="sub mid" x="196" y="71">MCL74 (JETSET 7.4),</text>
  <text class="sub mid" x="196" y="84">KORALZ for τ pairs</text>
  <rect class="paper" x="270" y="34" width="112" height="64" rx="4"/>
